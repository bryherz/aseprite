name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Aseprite code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Ninja
      uses: llvm/actions/install-ninja@main

    - name: Download Skia
      run: |
        curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m102-861e474326/Skia-Windows-Release-x64.zip
        7z x skia.zip -oskia

    - name: Configure CMake
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAF_BACKEND=skia -DSKIA_DIR=skia -DSKIA_LIBRARY_DIR=skia/out/Release-x64 -DSKIA_LIBRARY=skia/out/Release-x64/skia.lib

    - name: Compile
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        ninja -C build aseprite

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows
        path: build/bin/
