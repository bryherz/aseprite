name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Install Python (necesario para compilar Skia)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone and compile Skia
        shell: pwsh
        run: |
          # Clonar Skia desde el repositorio oficial de Aseprite
          git clone --depth 1 --branch aseprite-m124 https://github.com/aseprite/skia.git
          cd skia
          
          # Usar el script oficial de Aseprite para compilar Skia
          python tools/aseprite-skia-build.py

      - name: Verify Skia
        shell: pwsh
        run: |
          if (-not (Test-Path "skia/out/Release-x64/skia.lib")) {
            Write-Error "❌ No se encontró skia.lib"
            exit 1
          }
          Write-Host "✅ Skia compilado correctamente"

      - name: Compile Aseprite
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SCRIPTING=ON -DSKIA_DIR=../skia -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 -DSKIA_LIBRARY=../skia/out/Release-x64/skia.lib ..
          ninja aseprite

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: build/bin/aseprite.exe
